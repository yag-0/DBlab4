{% extends "base.html" %}
{% block title %}Редагувати фільм{% endblock %}
{% block content %}
<div class="form-container">
    <h2>✏️ Редагувати дані фільму</h2>
    <form method="POST" style="margin-top: 1.5rem;">
        <div class="form-group">
            <label for="title">Назва фільму:</label>
            <input type="text" id="title" name="title" value="{{ movie[1] if movie != none else '' }}" required>
        </div>
        <div class="form-group">
            <label for="rating">Рейтинг:</label>
            <input type="number" id="rating" name="rating" step="0.1" min="0" max="10" value="{{ movie[4] if movie != none else '' }}" required>
        </div>
        <div class="form-group">
            <label for="budget">Бюджет ($):</label>
            <input type="number" id="budget" name="budget" step="0.01" min="0" value="{{ movie[5] if movie != none else '' }}" required>
        </div>
        <div class="form-actions">
            <a href="{{ url_for('movies') }}" class="btn" style="background-color: #95a5a6; color: white;">Скасувати</a>
            <button type="submit" class="btn btn-primary">Оновити</button>
        </div>
    </form>
</div>
{% endblock %}

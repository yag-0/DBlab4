{% extends "base.html" %}
{% block title %}Додати фільм{% endblock %}
{% block content %}
<div class="form-container">
    <h2>➕ Додати новий фільм</h2>
    <form method="POST" style="margin-top: 1.5rem;">
        <div class="form-group">
            <label for="title">Назва фільму:</label>
            <input type="text" id="title" name="title" required>
        </div>
        <div class="form-group">
            <label for="year">Рік випуску:</label>
            <input type="number" id="year" name="year" min="1888" max="2100" required>
        </div>
        <div class="form-group">
            <label for="duration">Тривалість (хв):</label>
            <input type="number" id="duration" name="duration" min="1" required>
        </div>
        <div class="form-group">
            <label for="rating">Рейтинг (0.0 - 10.0):</label>
            <input type="number" id="rating" name="rating" step="0.1" min="0" max="10" required>
        </div>
        <div class="form-group">
            <label for="budget">Бюджет ($):</label>
            <input type="number" id="budget" name="budget" step="0.01" min="0" required>
        </div>
        <div class="form-actions">
            <a href="{{ url_for('movies') }}" class="btn" style="background-color: #95a5a6; color: white;">Скасувати</a>
            <button type="submit" class="btn btn-primary">Зберегти фільм</button>
        </div>
    </form>
</div>
{% endblock %}
